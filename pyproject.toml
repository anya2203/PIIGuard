[project]
name = "piiguard"
version = "0.1.0"
description = "PIIGuard — Offline PII Detection and Pseudonymization Pipeline"
readme = "README.md"
authors = [
    { name = "PIIGuard Contributors" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "faker>=40.43.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
